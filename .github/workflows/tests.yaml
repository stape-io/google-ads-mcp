name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Unit + Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run python -m unittest discover --buffer -s=tests -p "*_test.py"

      - name: Run smoke tests
        run: uv run python -m unittest tests/smoke/smoke_test.py
