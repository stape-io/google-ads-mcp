apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Google Ads settings
            - name: GOOGLE_ADS_DEVELOPER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: developer-token
            {{- with .Values.loginCustomerId }}
            - name: GOOGLE_ADS_LOGIN_CUSTOMER_ID
              value: {{ . | quote }}
            {{- end }}

            # MCP server settings
            - name: GOOGLE_ADS_MCP_BASE_URL
              value: {{ .Values.baseUrl | default (printf "https://%s" .Values.host) | quote }}
            - name: GOOGLE_ADS_MCP_AUTH_PROVIDER
              value: {{ .Values.auth.provider | default "google" | quote }}

            {{- if or (not .Values.auth.provider) (eq .Values.auth.provider "google") }}
            # Google OAuth provider
            - name: GOOGLE_ADS_MCP_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: google-oauth-client-id
            - name: GOOGLE_ADS_MCP_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: google-oauth-client-secret
            {{- with .Values.auth.google.requireAuthorizationConsent }}
            - name: GOOGLE_ADS_MCP_OAUTH_REQUIRE_AUTHORIZATION_CONSENT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.google.extraAuthorizeParams }}
            - name: GOOGLE_ADS_MCP_OAUTH_EXTRA_AUTHORIZE_PARAMS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.google.jwtSigningKeyEnabled }}
            - name: GOOGLE_ADS_MCP_OAUTH_JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: google-oauth-jwt-signing-key
            {{- end }}

            # Auth storage
            {{- with .Values.auth.google.storage.type }}
            - name: GOOGLE_ADS_MCP_AUTH_STORAGE_TYPE
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.auth.google.storage.type "redis" }}
            - name: GOOGLE_ADS_MCP_AUTH_STORAGE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: auth-storage-redis-url
            {{- end }}
            {{- if and (eq .Values.auth.google.storage.type "disk") .Values.auth.google.storage.diskDirectory }}
            - name: GOOGLE_ADS_MCP_AUTH_STORAGE_DISK_DIRECTORY
              value: {{ .Values.auth.google.storage.diskDirectory | quote }}
            {{- end }}
            {{- if .Values.auth.google.storage.encryptionKeyEnabled }}
            - name: GOOGLE_ADS_MCP_AUTH_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: auth-storage-encryption-key
            {{- end }}

            {{- else if eq .Values.auth.provider "remote" }}
            # Remote auth provider
            - name: GOOGLE_ADS_MCP_AUTH_SERVER_URL
              value: {{ .Values.auth.remote.serverUrl | quote }}

            # Token verifier
            - name: GOOGLE_ADS_MCP_AUTH_TOKEN_VERIFIER_URL
              value: {{ .Values.auth.remote.tokenVerifier.url | quote }}
            {{- with .Values.auth.remote.tokenVerifier.method }}
            - name: GOOGLE_ADS_MCP_AUTH_TOKEN_VERIFIER_METHOD
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.remote.tokenVerifier.contentType }}
            - name: GOOGLE_ADS_MCP_AUTH_TOKEN_VERIFIER_CONTENT_TYPE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.remote.tokenVerifier.auth }}
            - name: GOOGLE_ADS_MCP_AUTH_TOKEN_VERIFIER_AUTH
              value: {{ . | quote }}
            {{- end }}
            {{- if and (eq .Values.auth.remote.tokenVerifier.auth "bearer") .Values.auth.remote.tokenVerifier.bearerTokenEnabled }}
            - name: GOOGLE_ADS_MCP_AUTH_TOKEN_VERIFIER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: token-verifier-bearer-token
            {{- end }}
            {{- if eq .Values.auth.remote.tokenVerifier.auth "basic" }}
            - name: GOOGLE_ADS_MCP_AUTH_TOKEN_VERIFIER_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: token-verifier-basic-username
            - name: GOOGLE_ADS_MCP_AUTH_TOKEN_VERIFIER_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: token-verifier-basic-password
            {{- end }}

            {{- if .Values.auth.remote.jwtProvider.enabled }}
            # JWT provider for dynamic bearer token generation
            - name: GOOGLE_ADS_MCP_AUTH_JWT_PROVIDER_PRIVATE_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: jwt-provider-private-keys
            - name: GOOGLE_ADS_MCP_AUTH_JWT_PROVIDER_ALGORITHM
              value: {{ .Values.auth.remote.jwtProvider.algorithm | quote }}
            {{- with .Values.auth.remote.jwtProvider.tokenLifetime }}
            - name: GOOGLE_ADS_MCP_AUTH_JWT_PROVIDER_TOKEN_LIFETIME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.remote.jwtProvider.claims }}
            - name: GOOGLE_ADS_MCP_AUTH_JWT_PROVIDER_CLAIMS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: jwt-provider-claims
            {{- end }}
            {{- end }}
            {{- end }}

          resources:
            {{- with .Values.resources }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Release.Name }}
      {{- end }}
