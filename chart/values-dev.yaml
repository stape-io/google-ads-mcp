onePasswordSecrets:
  vault: google-ads-mcp-dev
  manualItem: google-ads-mcp_dev-manual
host: mcp-google-ads.stape.dev
image:
  repository: europe-west1-docker.pkg.dev/stape-development/stape/google-ads-mcp
  tag: 7e386c0-43046105264-1

# VerticalPodAutoscaler, iris 7d peak on dev (OPS-2603): 5m / 206Mi against a 10m / 200Mi request.
# minMemory is half the request, rounded down; there are no limits, so maxCpu and maxMemory stand in
# for them (memory: twice the 7d peak, rounded up).
vpa:
  enabled: true
  main:
    minMemory: 64Mi
    maxCpu: 500m
    maxMemory: 512Mi
