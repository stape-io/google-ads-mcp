# Development overrides — combine with values-google.yaml or values-remote.yaml.
# Example:
#   helm upgrade --install google-ads-mcp ./helm-chart/google-ads-mcp \
#     -f values-google.yaml -f values-dev.yaml

# No TLS certificate or IngressRoute in dev — use kubectl port-forward instead
certificate:
  enabled: true
  issuerRef:
    name: cloudflare
    kind: ClusterIssuer


ingressRoute:
  enabled: true


secret:
  create: false  # Manage the Secret externally

image:
  pullPolicy: IfNotPresent
