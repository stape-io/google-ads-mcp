onePasswordSecrets:
  vault: google-ads-mcp
  manualItem: google-ads-mcp_production-manual
hpa:
  enabled: true
host: mcp-google-ads.stape.io
image:
  repository: europe-west1-docker.pkg.dev/stape-production/stape/google-ads-mcp
  tag: 761ea33-42861112970-1
resources:
  requests:
    cpu: 150m
    memory: 300Mi

# HPA on cpu -> memory only. thor 7d peak 356Mi. minAllowed memory: request / 2 rounded down to a power of 2;
# maxAllowed memory (no limit): peak x2 rounded up to a power of 2
vpa:
  controlledResources: ["memory"]
  minAllowed:
    memory: 128Mi
  maxAllowed:
    memory: 1Gi
