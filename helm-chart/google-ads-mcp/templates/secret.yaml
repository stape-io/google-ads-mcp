{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "google-ads-mcp.fullname" . }}
  labels:
    {{- include "google-ads-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  # Required for all providers
  {{- with .Values.secret.data.developerToken }}
  developer-token: {{ . | b64enc | quote }}
  {{- end }}

  {{- if or (not .Values.auth.provider) (eq .Values.auth.provider "google") }}
  # Google OAuth credentials
  {{- with .Values.secret.data.googleOauthClientId }}
  google-oauth-client-id: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secret.data.googleOauthClientSecret }}
  google-oauth-client-secret: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.google.jwtSigningKeyEnabled }}
  {{- with .Values.secret.data.googleOauthJwtSigningKey }}
  google-oauth-jwt-signing-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  # Auth storage secrets
  {{- if eq .Values.auth.google.storage.type "redis" }}
  {{- with .Values.secret.data.authStorageRedisUrl }}
  auth-storage-redis-url: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.google.storage.encryptionKeyEnabled }}
  {{- with .Values.secret.data.authStorageEncryptionKey }}
  auth-storage-encryption-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}

  {{- else if eq .Values.auth.provider "remote" }}
  # Remote auth secrets
  {{- if and (eq .Values.auth.remote.tokenVerifier.auth "bearer") .Values.auth.remote.tokenVerifier.bearerTokenEnabled }}
  {{- with .Values.secret.data.tokenVerifierBearerToken }}
  token-verifier-bearer-token: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.auth.remote.tokenVerifier.auth "basic" }}
  {{- with .Values.secret.data.tokenVerifierBasicUsername }}
  token-verifier-basic-username: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secret.data.tokenVerifierBasicPassword }}
  token-verifier-basic-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auth.remote.jwtProvider.enabled }}
  {{- with .Values.secret.data.jwtProviderPrivateKeys }}
  jwt-provider-private-keys: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.remote.jwtProvider.claims }}
  jwt-provider-claims: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
